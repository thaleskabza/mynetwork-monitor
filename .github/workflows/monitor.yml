name: 🛠️ Build & Launch Network Monitor

on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: 🐳 Set up Docker
      uses: docker/setup-buildx-action@v3

    - name: 📦 Install Docker Compose CLI (for `docker compose`)
      run: |
        sudo apt-get update

    - name: 🔧 Build Docker Compose Services
      run: docker compose build --no-cache
      continue-on-error: false
    
    - name: 📊 List Running 
      run: docker compose ps
      continue-on-error: false

    - name: 🚀 Start Network Monitor Stack
      run: docker compose up -d
      continue-on-error: false

    - name: 📈 Check Grafana Logs
      run: docker compose logs grafana | tail -n 50
      continue-on-error: false
    
    - name: 🧪 Test log-reader logs
      run: docker compose logs log-reader | tail -n 20
      continue-on-error: false

    - name: 🤖 Run ML Agent Manually
      run: docker compose exec ml-agent python model.py
      continue-on-error: true


    - name: Take down all containers
      run: docker compose down -v
